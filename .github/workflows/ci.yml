name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (Dependabot keeps them current). The uv cache is off when
# a tag is being published, so a poisoned cache cannot reach the release.
jobs:
  check:
    name: Lint, type-check and test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Sync
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Build
        run: uv build

  lowest-bounds:
    name: Test against the lowest declared versions (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: pytest
        run: uv run --resolution lowest-direct --isolated --group dev --python ${{ matrix.python }} pytest

  latest-releases:
    name: Test against the latest releases of every dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Sync, ignoring the lockfile's versions
        run: uv sync --upgrade --group dev --python 3.14
      - name: pytest
        run: uv run --no-sync pytest

  home-assistant-pins:
    name: Test against Home Assistant's Bluetooth pins (dev branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Sync
        run: uv sync --locked --group dev --python 3.14
      - name: Install Home Assistant's pins
        run: |
          curl -fsSL https://raw.githubusercontent.com/home-assistant/core/dev/homeassistant/package_constraints.txt \
            | grep -E '^(bleak|bleak-retry-connector|bluetooth-adapters|dbus-fast)==' > ha-pins.txt
          cat ha-pins.txt
          test "$(wc -l < ha-pins.txt)" -eq 4
          uv pip install -r ha-pins.txt
      - name: pytest
        run: uv run --no-sync pytest

  zizmor:
    name: Audit the workflows with zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.32.0 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
