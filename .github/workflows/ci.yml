name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --group dev --python ${{ matrix.python }}
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Build
        run: uv build

  home-assistant-pins:
    name: Test against Home Assistant's Bluetooth pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --group dev --python 3.14
      - name: Install Home Assistant's pins
        run: uv pip install "bleak==3.0.2" "bleak-retry-connector==4.7.1"
      - name: pytest
        run: uv run --no-sync pytest
